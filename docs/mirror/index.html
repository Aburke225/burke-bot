<!--
  COMPATIBILITY SHIM - safe to delete once no old links are in circulation.

  This page was called Mirror Bot and lived at /mirror/. Every share link it
  ever produced carries the whole bot in its hash fragment, so a link that
  404s is a bot that no longer exists for whoever was sent it. This forwards
  to the new address with the fragment intact.

  It is the only remaining use of the old name, and it is deliberate.
-->
<style>
  body{margin:0;background:#162117;color:#edf1e4;font:14px "IBM Plex Mono",ui-monospace,Menlo,monospace;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:1.25rem}
  a{color:#8fc57f}
</style>
</head>
<body>
<script>
  // search first, then hash - the fragment carries the packed bot and must
  // survive verbatim. replace() so Back does not bounce through this page.
  location.replace("../build-a-bot/" + location.search + location.hash)
</script>
<p>This moved to <a href="../build-a-bot/">Build-a-Bot</a>.</p>
</body>
