<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burke Bot</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <script>
    // boot veil: hide the page until the layout settles (fonts swapping in,
    // the board svg inflating, stats filling) so it fades in as one unit.
    // app.js lifts it when ready; this timeout is the never-stuck fallback.
    document.documentElement.classList.add('booting');
    setTimeout(function () { document.documentElement.classList.remove('booting'); }, 3000);
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9822;</text></svg>">
  <meta name="description" content="A chess bot built from every game Andrew Burke has ever played — it opens like him, attacks like him, and blunders like him.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
  <link rel="stylesheet" href="style.css?v=59">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1 class="wordmark">Burke Bot<span class="version" id="model-version" hidden></span></h1>
      <div class="header-actions">
        <button type="button" class="login-btn" id="bb-login">login</button>
        <button type="button" class="theme-toggle" id="sound-toggle" aria-label="Mute sounds"></button>
        <button class="theme-toggle" aria-label="Switch to light mode"></button>
      </div>
      <p class="tagline">A bot built from every chess game I've ever played.</p>
    </header>


    <main class="layout">
      <section class="board-col">
        <div class="player" id="pl-top">
          <span class="avatar" id="av-top"></span>
          <span class="pinfo">
            <span class="pname" id="nm-top"></span>
            <span class="caps" id="cap-top"></span>
          </span>
        </div>
        <div class="board-wrap">
          <span class="eval-num" id="eval-num" hidden>0.0</span>
          <div class="eval-bar" id="eval-bar" title="engine evaluation (White's chances)" hidden>
            <div class="eval-fill" id="eval-fill"></div>
          </div>
          <div class="board" id="board"></div>
          <div class="board-overlay" id="pick">
            <p class="ov-kicker">new game</p>
            <div class="ov-buttons">
              <button id="pick-white" class="btn">Play as White</button>
              <button id="pick-black" class="btn">Play as Black</button>
            </div>
          </div>
          <div class="board-overlay" id="confirm" hidden>
            <p class="ov-kicker">are you sure?</p>
            <div class="ov-buttons">
              <button id="resign-no" class="btn">Back to the game</button>
              <button id="resign-yes" class="btn">Yes, resign</button>
            </div>
          </div>
          <div class="board-overlay" id="end" hidden>
            <p class="ov-title" id="end-title"></p>
            <p class="ov-line" id="end-line"></p>
            <button id="again" class="btn">Play again</button>
          </div>
        </div>
        <div class="player" id="pl-bot">
          <span class="avatar" id="av-bot"></span>
          <span class="pinfo">
            <span class="pname" id="nm-bot"></span>
            <span class="caps" id="cap-bot"></span>
          </span>
        </div>
      </section>

      <aside class="panel">
        <div class="status-card">
          <div class="status-head">
            <span class="dot" id="status-dot"></span>
            <span id="status-label">setting up</span>
          </div>
          <p class="status-line" id="status-line">Loading my games…</p>
        </div>

        <div class="moves-card">
          <div class="moves-head">
            <h2>Moves</h2>
            <button type="button" class="copy-btn" id="copy-moves"
                    aria-label="Copy the move list" title="Copy the move list"></button>
          </div>
          <ol class="movelist" id="movelist"></ol>
        </div>

        <div class="stats-card" id="stats-card">
          <h2>The data behind me</h2>
          <dl id="stats-list"></dl>
        </div>

        <div class="controls">
          <button id="resign-btn" class="btn" disabled>Resign</button>
          <a id="build-btn" class="btn" href="build-a-bot/">Build your own bot!</a>
        </div>
      </aside>
    </main>

    <footer>
      <div class="foot-rule"></div>
      <div class="foot-inner">&copy; 2026 <a href="https://aburke225.github.io">Andrew Burke</a> &middot; <a href="https://github.com/Aburke225/burke-bot">Source on GitHub</a> &middot; games from <a href="https://www.chess.com/member/Burkeley">chess.com/Burkeley</a><span class="heartbeat" id="heartbeat" hidden></span></div>
    </footer>
  </div>
  <script>
    // light/dark toggle, same protocol as my other sites: dark by default,
    // the override lives in localStorage. Sun while dark, moon while light.
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('.theme-toggle:not(#sound-toggle)');
      var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      function current() {
        return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      }
      function render() {
        var dark = current() === 'dark';
        btn.innerHTML = dark ? SUN : MOON;
        btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        btn.title = dark ? 'Light mode' : 'Dark mode';
      }
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        if (next === 'light') root.setAttribute('data-theme', 'light');
        else root.removeAttribute('data-theme');
        render();
      });
      render();
    })();
  </script>
  <script type="module" src="app.js?v=77"></script>
</body>
</html>
