name: update book

on:
  schedule:
    # Off the top of the hour on purpose. A huge share of every cron on GitHub
    # is set to :00, and scheduled runs queue behind that spike - the four runs
    # so far landed 3h21m to 5h20m late. An odd minute misses the herd. It does
    # not make the schedule a guarantee; nothing does.
    - cron: "17 13 * * *" # daily, 13:17 UTC = 6:17am PDT / 5:17am PST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-chess numpy

      # Before anything touches the real data: prove the capture path still
      # works with a NON-EMPTY store. That path silently never ran for a week
      # and every run was green, because site-games.json was always empty.
      - name: guard the capture path
        run: python pipeline/test_capture.py

      - name: pull the games played on the site
        env:
          CHESS_KEY: ${{ secrets.CHESS_KEY }}
        run: |
          if [ -n "$CHESS_KEY" ]; then
            # a failed pull keeps the committed copy - never drop games over a network blip
            curl -sf "https://prompt-yourself-bot.andrewburke225.workers.dev/chess/games?key=$CHESS_KEY" \
              -o /tmp/site-games.json && mv /tmp/site-games.json pipeline/site-games.json \
              || echo "pull failed - keeping the committed site games"
          fi

      - run: python pipeline/build.py

      - name: check for new games
        id: gate
        run: |
          fp_new=$(python3 -c "import hashlib; print(hashlib.md5(open('pipeline/games-cache.json','rb').read()).hexdigest())")
          fp_old=$(cat pipeline/games-fingerprint.txt 2>/dev/null || echo "none")
          if [ "$fp_new" = "$fp_old" ]; then
            echo "no new games since the last retrain - stopping here"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "game set changed ($fp_old -> $fp_new) - rebuilding and retraining"
            echo "$fp_new" > pipeline/games-fingerprint.txt
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # no engine install: the analysis runs the site's own vendored WASM
      # stockfish through node (preinstalled on the runner), so play and
      # training can never drift onto different engines.
      # Three stages now, deliberately split: the engine pass is the expensive,
      # cacheable half, and feature extraction is the cheap, re-runnable half.
      - name: analyse the games (engine pass)
        if: steps.gate.outputs.changed == 'yes'
        run: python pipeline/analyse.py

      - name: extract v9 features
        if: steps.gate.outputs.changed == 'yes'
        run: python pipeline/build_examples_v9.py

      - name: retrain the style model
        if: steps.gate.outputs.changed == 'yes'
        run: python pipeline/train_v9.py

      # Written on every successful run, including the no-op ones. A missed
      # cron is invisible otherwise: no run means no failure means no email.
      - name: stamp the heartbeat
        run: |
          printf '{"utc":"%s","retrained":%s}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ steps.gate.outputs.changed == 'yes' && 'true' || 'false' }}" \
            > docs/last-run.json

      - name: commit and push
        run: |
          git config user.name "Andrew Burke"
          git config user.email "aburke225@berkeley.edu"
          git add docs/last-run.json
          if [ "${{ steps.gate.outputs.changed }}" = "yes" ]; then
            git add docs/book.json docs/stats.json docs/style-v9.json pipeline/games-fingerprint.txt
          fi
          if [ -f pipeline/site-games.json ]; then git add pipeline/site-games.json; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "update book from latest games"
            git push
            # GitHub Pages sometimes skips builds triggered by token pushes — nudge it
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
