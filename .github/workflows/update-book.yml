name: update book

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC = 6am PDT / 5am PST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-chess numpy

      - name: pull the games played on the site
        env:
          CHESS_KEY: ${{ secrets.CHESS_KEY }}
        run: |
          if [ -n "$CHESS_KEY" ]; then
            # a failed pull keeps the committed copy - never drop games over a network blip
            curl -sf "https://prompt-yourself-bot.andrewburke225.workers.dev/chess/games?key=$CHESS_KEY" \
              -o /tmp/site-games.json && mv /tmp/site-games.json pipeline/site-games.json \
              || echo "pull failed - keeping the committed site games"
          fi

      - run: python pipeline/build.py

      - name: check for new games
        id: gate
        run: |
          fp_new=$(python3 -c "import hashlib; print(hashlib.md5(open('pipeline/games-cache.json','rb').read()).hexdigest())")
          fp_old=$(cat pipeline/games-fingerprint.txt 2>/dev/null || echo "none")
          if [ "$fp_new" = "$fp_old" ]; then
            echo "no new games since the last retrain - stopping here"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "game set changed ($fp_old -> $fp_new) - rebuilding and retraining"
            echo "$fp_new" > pipeline/games-fingerprint.txt
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # no engine install: the trainer analyses with the site's own vendored
      # WASM stockfish, run through node (preinstalled on the runner)
      - name: retrain the style model
        if: steps.gate.outputs.changed == 'yes'
        run: python pipeline/train_style.py

      - name: commit and push
        if: steps.gate.outputs.changed == 'yes'
        run: |
          git config user.name "Andrew Burke"
          git config user.email "aburke225@berkeley.edu"
          git add docs/book.json docs/stats.json docs/style.json pipeline/games-fingerprint.txt
          if [ -f pipeline/site-games.json ]; then git add pipeline/site-games.json; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "update book from latest games"
            git push
            # GitHub Pages sometimes skips builds triggered by token pushes — nudge it
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
