# Fast checks on every push, so a broken data path is caught at commit time
# rather than at 6am - or, as happened once, not at all. The capture path in
# particular went a week silently broken while every nightly run reported
# success, because the code that breaks only runs when a game has actually
# been captured.
name: tests

on:
  push:
    paths:
      - "pipeline/**"
      - "docs/app.js"
      # the THIRD copy of the v9 feature contract. parity_v9.mjs checks it
      # against the same python vectors as app.js, but the guard is only real
      # if a change to it actually triggers the run.
      - "docs/mirror/v9.js"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-chess numpy

      # runs the real build.main() against a non-empty captured-games store
      - name: capture path
        run: python pipeline/test_capture.py

      # the two halves of the v9 feature contract must agree, or the bot plays
      # a different game than the one it was trained on
      - name: v9 python/javascript parity
        run: python pipeline/test_parity.py
